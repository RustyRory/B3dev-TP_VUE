version: '3.8'

services:
  B3dev-TP_VUE-api:
    build:
      context: ./B3dev-TP_VUE/express-project
      dockerfile: deployment/Dockerfile
    container_name: B3dev-TP_VUE-api
    ports:
      - "3003:3000"
    environment:
      - NODE_ENV=test

  B3dev-TP_VUE-front:
    build:
      context: ./B3dev-TP_VUE/my-project
      dockerfile: deployment/Dockerfile
    container_name: B3dev-TP_VUE-front
    ports:
      - "8080:80"

  mongo:
    image: mongo
    container_name: mongo
    volumes:
      - ./data/mongo:/data/db