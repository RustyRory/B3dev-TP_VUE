version: '3.8'

services:
  tpvue-api:
    build:
      context: ./B3dev-TP_VUE/express-project
      dockerfile: deployment/Dockerfile
    container_name: tpvue-api
    ports:
      - "3003:3003"
    volumes:
      - ./express-project:/usr/src/app
    environment:
      - NODE_ENV=production

  tpvue-front:
    build:
      context: ./B3dev-TP_VUE/my-project
      dockerfile: deployment/Dockerfile
    container_name: tpvue-front
    ports:
      - "8080:80" 