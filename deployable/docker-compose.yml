version: '3.8'

services:
  tpvue-api:
    build:
      context: ./tpvue/express-project
      dockerfile: deployment/Dockerfile
    container_name: tpvue-api
    ports:
      - "3003:3000"

  tpvue-front:
    build:
      context: ./tpvue/my-project
      dockerfile: deployment/Dockerfile
    container_name: tpvue-front
    ports:
      - "8080:80"