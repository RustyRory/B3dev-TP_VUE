server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gestion du frontend (Vue / Vite)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # (Optionnel) cache des assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # (Optionnel) éviter logs inutiles favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}